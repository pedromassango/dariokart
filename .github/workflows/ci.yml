name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run riv
      - run: npm test
      - run: npm run build
      - name: Verify the Rive Scripting projects (Luau, AnimaScript, WGSL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1 libgbm1 > /dev/null
          curl -fsSL https://releases.rive.app/cli/install.sh | bash
          export PATH="$HOME/.rive/bin:$PATH"
          npm run rive:verify
