<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dariokart Rive Assets</title>
<style>
  :root { --bg: #14101c; --card: #221a2e; --ink: #f4ecff; --dim: #a898c0; --accent: #ffd23f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding: 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; color: var(--accent); letter-spacing: 1px; }
  #status { color: var(--dim); }
  #grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 24px; }
  .card { background: var(--card); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .card canvas { display: block; border-radius: 6px;
    background: repeating-conic-gradient(#2c2438 0% 25%, #261f31 0% 50%) 50% / 16px 16px; }
  .name { font-weight: 600; font-size: 13px; }
  .size { color: var(--dim); font-weight: 400; font-size: 12px; }
  .inputs { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .inputs label { display: flex; align-items: center; gap: 6px; }
  .inputs input[type=range] { flex: 1; min-width: 80px; }
  .inputs button { background: #3a2d4d; color: var(--ink); border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .inputs button.on { background: var(--accent); color: #1a1020; }
  .section { width: 100%; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>DARIOKART · Rive asset preview</h1>
  <span id="status">loading…</span>
</header>
<div id="grid"></div>
<script type="module">
import RiveCanvas from '/node_modules/@rive-app/canvas-advanced/canvas_advanced.mjs';

// Query params: ?only=Kart_dario,Logo  ?set=steer:-1,boost:1  ?scale=2  ?t=1.5 (advance fixed time, then freeze)
const params = new URLSearchParams(location.search);
const only = params.get('only')?.split(',').filter(Boolean);
const preset = Object.fromEntries((params.get('set') || '').split(',').filter(Boolean).map((kv) => kv.split(':')));
const userScale = parseFloat(params.get('scale') || '0');
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;

const RANGES = { steer: [-1, 1, 0.05], stage: [0, 3, 1], rank: [1, 3, 1], view: [0, 4, 1] };
const SECTIONS = [['Glyph_', 'HUD font'], ['Place_', 'HUD'], ['ItemSlot', 'HUD'], ['Lap', 'HUD'], ['Banner', 'Banner'], ['Logo', 'Title'], ['Referee', 'Referee'], ['Portrait_', 'Portraits'], ['Kart_', 'Karts'], ['Item_', 'Items'], ['ItemBox', 'Items'], ['Trophy', 'Trophy'], ['ItemPanel', 'Track props'], ['Pipe', 'Track props'], ['Thwomp', 'Track props'], ['Tree', 'Track props'], ['Bush', 'Track props'], ['Palm', 'Track props'], ['DeadTree', 'Track props'], ['Mole', 'Track props']];

const status = document.getElementById('status');
const grid = document.getElementById('grid');

const rive = await RiveCanvas({ // the package ships its wasm as rive.wasm (the loader asks for canvas_advanced.wasm)
  locateFile: (f) => '/node_modules/@rive-app/canvas-advanced/' + (f.endsWith('.wasm') ? 'rive.wasm' : f) });
const bytes = new Uint8Array(await (await fetch('/assets/dariokart.riv?' + Date.now())).arrayBuffer());
const file = await rive.load(bytes);
if (!file) { status.textContent = 'Failed to load dariokart.riv'; throw new Error('load failed'); }

const entries = [];
const dpr = Math.min(2, window.devicePixelRatio || 1);
let lastSection = null;
for (let i = 0; i < file.artboardCount(); i++) {
  const name = file.artboardByIndex(i).name;
  if (only && !only.includes(name)) continue;
  const ab = file.artboardByName(name);
  const b = ab.bounds;
  const w = b.maxX - b.minX, h = b.maxY - b.minY;
  const sec = SECTIONS.find(([p]) => name.startsWith(p))?.[1] ?? 'Other';
  if (sec !== lastSection) {
    const s = document.createElement('div'); s.className = 'section'; s.textContent = sec; grid.appendChild(s); lastSection = sec;
  }
  const scale = userScale || (name.startsWith('Glyph_') ? 1 : w >= 400 ? (w > 700 ? 0.75 : 1) : w >= 200 ? 1 : w >= 128 ? 1.5 : w >= 96 ? 2 : 2.5);
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="name">${name} <span class="size">${w}×${h}</span></div>`;
  const canvas = document.createElement('canvas');
  canvas.width = cw * dpr; canvas.height = ch * dpr; canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  card.appendChild(canvas);
  const renderer = rive.makeRenderer(canvas);
  const sm = ab.stateMachineByName('Main');
  const smi = sm ? new rive.StateMachineInstance(sm, ab) : null;
  const inputsDiv = document.createElement('div'); inputsDiv.className = 'inputs';
  if (smi) {
    for (let j = 0; j < smi.inputCount(); j++) {
      const inp = smi.input(j);
      const label = document.createElement('label');
      if (inp.type === 56) { // number
        const n = inp.asNumber();
        const [mn, mx, st] = RANGES[inp.name] ?? [0, 1, 0.01];
        if (preset[inp.name] != null) n.value = parseFloat(preset[inp.name]);
        label.innerHTML = `<span>${inp.name}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${n.value}"><code>${(+n.value).toFixed(2)}</code>`;
        const r = label.querySelector('input'), c = label.querySelector('code');
        r.oninput = () => { n.value = parseFloat(r.value); c.textContent = (+r.value).toFixed(2); };
      } else if (inp.type === 59) { // bool
        const bi = inp.asBool();
        if (preset[inp.name] != null) bi.value = preset[inp.name] === '1' || preset[inp.name] === 'true';
        const btn = document.createElement('button'); btn.textContent = inp.name;
        const sync = () => btn.classList.toggle('on', !!bi.value); sync();
        btn.onclick = () => { bi.value = !bi.value; sync(); };
        label.appendChild(btn);
      } else { // trigger
        const t = inp.asTrigger(); const btn = document.createElement('button'); btn.textContent = '▶ ' + inp.name;
        btn.onclick = () => t.fire(); label.appendChild(btn);
      }
      inputsDiv.appendChild(label);
    }
  } else {
    inputsDiv.textContent = 'no Main state machine!';
  }
  card.appendChild(inputsDiv);
  grid.appendChild(card);
  entries.push({ name, ab, smi, renderer, canvas, w, h });
}
status.textContent = `${entries.length} artboards`;

function drawAll(dt) {
  for (const e of entries) {
    if (e.smi) e.smi.advance(dt);
    e.ab.advance(dt);
    e.renderer.clear();
    e.renderer.save();
    e.renderer.align(rive.Fit.contain, rive.Alignment.center,
      { minX: 0, minY: 0, maxX: e.canvas.width, maxY: e.canvas.height }, e.ab.bounds);
    e.ab.draw(e.renderer);
    e.renderer.restore();
  }
}

if (fixedT != null) {
  // Deterministic snapshot: advance in small steps to fixedT, then draw once.
  for (let t = 0; t < fixedT; t += 1 / 60) for (const e of entries) { if (e.smi) e.smi.advance(1 / 60); e.ab.advance(1 / 60); }
  drawAll(0);
  rive.resolveAnimationFrame();
  document.body.dataset.ready = '1';
} else {
  let last = 0;
  const loop = (time) => {
    const dt = last ? Math.min(0.05, (time - last) / 1000) : 0;
    last = time;
    drawAll(dt);
    rive.requestAnimationFrame(loop);
  };
  rive.requestAnimationFrame(loop);
}
</script>
</body>
</html>
